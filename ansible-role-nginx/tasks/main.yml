---
- name: Install Nginx
  apt: 
    name: nginx
    state: present
    update_cache: yes

- name: Copy Nginx configuration
  template: 
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf

- name: Copy default site configuration
  template:
    src: default.j2
    dest: /etc/nginx/sites-available/default

- name: Ensure Nginx is running
  service:
    name: nginx
    state: started
    enabled: true

