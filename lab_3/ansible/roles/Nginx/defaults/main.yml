---
nginx_configure_path: /etc/nginx/nginx.conf
nginx_back_host_group: app
nginx_listen_port: 8000
nginx_cache_path: /var/cache/nginx/static
nginx_default_backend_servers_port: 8000
nginx_proxy_access_log_path: /var/log/nginx/proxy_access.log
nginx_cache_access_log_path: /var/log/nginx/cache_access.log
nginx_cache_live_time: 60m
nginx_cache_levels: "1:2"
nginx_cache_keys_zone: STATIC:10m
nginx_static_data_path: /static/
nginx_max_cache_size: 1g
nginx_inactive_cache_time: 60m
